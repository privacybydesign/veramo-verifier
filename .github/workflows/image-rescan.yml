# Weekly re-scan of the PUBLISHED images (all platforms) for new CVEs.
name: Image rescan

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  rescan:
    uses: privacybydesign/github-workflows/.github/workflows/image-rescan.yml@v1
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      # :latest (now 1.6.6) was published by a manual run, without a GitHub release.
      tags: edge latest-release latest
      severity-cutoff: high
